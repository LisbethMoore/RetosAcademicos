# Despliegue en Render (Blueprint): crea los dos servicios desde este repositorio.
# Los valores con "sync: false" se escriben a mano en el panel de Render (no se suben a GitHub).
services:
  # Backend: la API de Node.js + Express
  - type: web
    name: retos-academicos-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI          # la cadena de conexión de MongoDB Atlas
        sync: false
      - key: TOKEN_SECRET         # Render genera una clave aleatoria
        generateValue: true
      - key: FRONTEND_URL         # la URL del frontend en Render (para CORS)
        sync: false

  # Frontend: React + Vite como sitio estático
  - type: web
    name: retos-academicos-front
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router: cualquier ruta (/jugar, /retos...) la resuelve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL         # la URL de la API en Render + /api
        sync: false
