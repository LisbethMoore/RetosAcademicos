# Despliegue en Render: un solo Web Service.
# Render construye el frontend (React) y la API de Express lo entrega en la misma dirección,
# así la cookie de la sesión funciona en cualquier navegador (también en incógnito).
# Los valores con "sync: false" se escriben en el panel de Render (no se suben a GitHub).
services:
  - type: web
    name: retos-academicos
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL         # la página llama a la API en la misma dirección
        value: /api
      - key: MONGODB_URI          # la cadena de conexión de MongoDB Atlas
        sync: false
      - key: TOKEN_SECRET         # Render genera una clave aleatoria
        generateValue: true
